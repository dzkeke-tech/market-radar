<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="财经雷达">

<title>财经雷达 · Market Radar</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Newsreader:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0e12;
    --bg-soft:#13161c;
    --card:#16191f;
    --card-hi:#1b1f27;
    --line:#262b34;
    --ink:#ece7dd;
    --ink-dim:#9aa0ab;
    --ink-faint:#646b78;
    --gold:#d6a64a;
    --gold-soft:#3a2f18;
    --up:#5fb98a;
    --down:#e0676b;
    --t1:#e0676b;
    --t2:#d6a64a;
    --t3:#5b8fb0;
    --hk:#5fb98a;
    --us:#5b8fb0;
    --a:#c98ad0;
    --radius:14px;
    --display:"Fraunces",Georgia,"Songti SC","Noto Serif CJK SC",serif;
    --serif:"Newsreader",Georgia,"Songti SC",serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(120% 60% at 50% -10%, #181b22 0%, var(--bg) 55%) fixed,
      var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{max-width:680px;margin:0 auto;padding:0 16px 90px}

  /* ---------- Masthead ---------- */
  header{padding:22px 0 14px;position:relative}
  .kicker{
    font-family:var(--sans);font-size:11px;letter-spacing:.32em;text-transform:uppercase;
    color:var(--gold);font-weight:600;display:flex;align-items:center;gap:8px;
  }
  .kicker::before{content:"";width:18px;height:1px;background:var(--gold);display:inline-block}
  h1{
    font-family:var(--display);font-weight:900;font-size:40px;line-height:.98;
    margin:6px 0 2px;letter-spacing:-.01em;
  }
  h1 .en{font-style:italic;font-weight:400;font-size:20px;color:var(--ink-dim);display:block;letter-spacing:.02em;margin-top:4px}
  .meta{
    display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;
    margin-top:12px;font-size:12.5px;color:var(--ink-faint);
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px 0;
  }
  .meta b{color:var(--ink-dim);font-weight:600}
  .pulse{width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 0 0 rgba(95,185,138,.6);animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(95,185,138,.5)}70%{box-shadow:0 0 0 7px rgba(95,185,138,0)}100%{box-shadow:0 0 0 0 rgba(95,185,138,0)}}

  /* ---------- Filter bar ---------- */
  .controls{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 70%,transparent);padding:12px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px}
  .tabs{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
  .tabs::-webkit-scrollbar{display:none}
  /* --- 刷新控件 --- */
  #refreshFab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:60;
    width:48px;height:48px;border-radius:50%;border:1px solid var(--line);
    background:var(--card-hi);color:var(--gold);font-size:22px;line-height:46px;text-align:center;padding:0;
    box-shadow:0 6px 20px rgba(0,0,0,.45);cursor:pointer;-webkit-tap-highlight-color:transparent;
    transition:transform .15s ease,opacity .15s ease}
  #refreshFab:active{transform:scale(.92)}
  #refreshFab.spin{animation:spin .8s linear infinite;color:var(--ink-dim)}
  @keyframes spin{to{transform:rotate(360deg)}}
  #ptr{position:fixed;top:env(safe-area-inset-top);left:0;right:0;z-index:55;
    display:flex;align-items:center;justify-content:center;height:0;overflow:hidden;
    color:var(--ink-faint);font:600 12px/1 var(--sans);letter-spacing:.05em;
    background:linear-gradient(var(--bg-soft),transparent);transition:height .12s ease}
  #ptr.show{height:46px}
  .tab{
    flex:0 0 auto;font-family:var(--sans);font-size:13px;font-weight:500;
    padding:7px 13px;border-radius:999px;border:1px solid var(--line);
    background:var(--bg-soft);color:var(--ink-dim);cursor:pointer;white-space:nowrap;
    transition:.18s;
  }
  .tab .n{font-size:11px;opacity:.6;margin-left:3px}
  .tab[data-on="1"]{background:var(--ink);color:#14110b;border-color:var(--ink);font-weight:600}
  .tab.star[data-on="1"]{background:var(--gold);border-color:var(--gold)}

  /* ---------- Feed ---------- */
  .feed{display:flex;flex-direction:column;gap:12px;margin-top:6px}
  .empty{text-align:center;color:var(--ink-faint);padding:48px 12px;font-size:14px;border:1px dashed var(--line);border-radius:var(--radius)}
  .card{
    position:relative;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:15px 15px 13px 18px;overflow:hidden;
    animation:rise .5s cubic-bezier(.2,.7,.2,1) backwards;
  }
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--t3)}
  .card[data-tier="1"]::before{background:var(--t1)}
  .card[data-tier="2"]::before{background:var(--t2)}
  .toprow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .mkt{font-size:10.5px;font-weight:700;letter-spacing:.08em;padding:2px 7px;border-radius:5px;border:1px solid currentColor}
  .mkt.HK{color:var(--hk)}.mkt.US{color:var(--us)}.mkt.A{color:var(--a)}
  .tier{font-size:10.5px;font-weight:600;letter-spacing:.05em;color:var(--ink-faint)}
  .tier b{color:var(--t1)}
  .new-pill{font-size:10px;font-weight:700;letter-spacing:.06em;color:#14110b;background:var(--gold);padding:2px 7px;border-radius:5px}
  .card[data-new="1"]{border-color:#4a3c1e}
  .card[data-new="1"]::after{content:"";position:absolute;top:0;right:0;width:42px;height:42px;background:radial-gradient(130% 130% at 100% 0,rgba(214,166,74,.16),transparent 70%);pointer-events:none}
  .divider{display:flex;align-items:center;gap:10px;color:var(--ink-faint);font-size:10.5px;letter-spacing:.22em;margin:8px 2px 0}
  .divider .ln{flex:1;height:1px;background:var(--line)}
  .time{margin-left:auto;font-size:11.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
  .title{font-family:var(--serif);font-size:18.5px;line-height:1.32;letter-spacing:.005em;margin:1px 0 7px;color:var(--ink)}
  .card[lang="en"] .title{font-style:normal}
  .summary{font-size:13.5px;color:var(--ink-dim);line-height:1.58;margin-bottom:10px}
  .why{font-size:12px;color:var(--gold);background:var(--gold-soft);border-radius:8px;padding:6px 9px;margin-bottom:10px;line-height:1.5}
  .why span{opacity:.7;font-weight:600;margin-right:4px}
  .botrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .src{font-size:11.5px;color:var(--ink-faint);font-weight:500}
  .src .badge{color:var(--up);font-size:10px;margin-left:5px;border:1px solid var(--up);padding:0 4px;border-radius:4px;opacity:.85}
  .kw{display:flex;gap:5px;flex-wrap:wrap}
  .kw span{font-size:11px;color:var(--ink-dim);background:var(--card-hi);border:1px solid var(--line);padding:2px 7px;border-radius:6px}
  .actions{margin-left:auto;display:flex;gap:6px;align-items:center}
  .iconbtn{
    width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--bg-soft);
    color:var(--ink-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;font-size:15px;text-decoration:none
  }
  .iconbtn:active{transform:scale(.92)}
  .star-btn[data-on="1"]{color:var(--gold);border-color:var(--gold);background:var(--gold-soft)}
  .star-btn[data-on="1"]::after{content:"★"}
  .star-btn::after{content:"☆"}
  .translated{font-size:10.5px;color:var(--us);border:1px solid var(--us);border-radius:4px;padding:0 5px;opacity:.8}

  /* ---------- Watchlist drawer ---------- */
  .section-h{display:flex;align-items:center;gap:10px;margin:26px 0 12px;cursor:pointer}
  .section-h h2{font-family:var(--display);font-weight:600;font-size:16px;margin:0;letter-spacing:.01em}
  .section-h .ln{flex:1;height:1px;background:var(--line)}
  .section-h .chev{color:var(--ink-faint);font-size:12px;transition:.2s}
  .wl{display:flex;flex-wrap:wrap;gap:7px}
  .wl span{font-size:12.5px;color:var(--ink);background:var(--bg-soft);border:1px solid var(--line);padding:5px 10px;border-radius:8px}
  .wl span.pos{border-color:var(--gold);color:var(--gold)}
  .note{font-size:11.5px;color:var(--ink-faint);margin-top:10px;line-height:1.6}

  /* ---------- Footer banner ---------- */
  .sample{position:fixed;bottom:0;left:0;right:0;z-index:30;
    background:linear-gradient(transparent,var(--bg) 30%);padding:14px 16px calc(14px + env(safe-area-inset-bottom));text-align:center}
  .sample div{display:inline-block;font-size:11.5px;color:var(--ink-faint);background:var(--bg-soft);border:1px solid var(--line);
    padding:7px 14px;border-radius:999px}
  .sample b{color:var(--gold)}

  @media(min-width:560px){h1{font-size:48px}h1 .en{font-size:22px}}

  /* ---------- 关键词编辑面板 ---------- */
  #kwGear{position:absolute;top:24px;right:0;width:38px;height:38px;border-radius:10px;
    border:1px solid var(--line);background:var(--bg-soft);color:var(--ink-dim);
    font-size:18px;line-height:36px;text-align:center;cursor:pointer;transition:.15s}
  #kwGear:active{transform:scale(.92)}
  #kwMask{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);
    display:none;align-items:flex-end;justify-content:center}
  #kwMask.show{display:flex}
  #kwPanel{width:100%;max-width:680px;max-height:92vh;overflow:auto;background:var(--bg-soft);
    border:1px solid var(--line);border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 40px rgba(0,0,0,.5)}
  #kwPanel h3{font-family:var(--display);font-weight:600;font-size:18px;margin:2px 0 2px}
  .kwhead{display:flex;align-items:center;gap:10px;margin-bottom:10px;position:sticky;top:0;background:var(--bg-soft);padding-bottom:8px;z-index:2}
  .kwhead .x{margin-left:auto;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);
    background:var(--card);color:var(--ink-dim);font-size:18px;line-height:32px;text-align:center;cursor:pointer}
  .kwhint{font-size:11.5px;color:var(--ink-faint);line-height:1.6;margin-bottom:12px}
  .kwentry{border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:10px;background:var(--card)}
  .kwentry .nm{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .kwentry .nm b{font-family:var(--display);font-weight:600;font-size:15px}
  .kwentry .nm .del{margin-left:auto;color:var(--down);font-size:12px;border:1px solid var(--line);
    border-radius:7px;padding:3px 8px;cursor:pointer;background:var(--bg-soft)}
  .kwrow{margin-bottom:7px}
  .kwrow .lab{font-size:10.5px;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase;margin-bottom:3px}
  .chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .chip{font-size:12px;color:var(--ink);background:var(--bg-soft);border:1px solid var(--line);
    border-radius:7px;padding:3px 7px;display:flex;align-items:center;gap:5px}
  .chip.core{border-color:var(--gold);color:var(--gold)}
  .chip .rm{cursor:pointer;opacity:.6;font-size:13px}
  .chip .rm:hover{opacity:1}
  .chipadd{font-size:12px;background:transparent;border:1px dashed var(--line);color:var(--ink-dim);
    border-radius:7px;padding:3px 8px;min-width:80px;outline:none}
  .kwbtn{font-size:12.5px;border:1px solid var(--line);background:var(--card-hi);color:var(--ink);
    border-radius:9px;padding:7px 12px;cursor:pointer;transition:.15s}
  .kwbtn:active{transform:scale(.96)}
  .kwbtn.gold{background:var(--gold);color:#14110b;border-color:var(--gold);font-weight:600}
  .kwbtn.ghost{background:transparent;color:var(--ink-dim)}
  .kwbtn[disabled]{opacity:.5;pointer-events:none}
  .kwadd{display:flex;gap:7px;margin:4px 0 14px}
  .kwadd input{flex:1;background:var(--card);border:1px solid var(--line);color:var(--ink);
    border-radius:9px;padding:8px 10px;outline:none;font-size:13px}
  .kwbar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg-soft) 30%);
    padding-top:12px;display:flex;gap:8px;align-items:center}
  .kwbar .status{font-size:11.5px;color:var(--ink-faint);margin-right:auto}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">每日三推 · 08:00 / 13:00 / 18:00</div>
    <div id="kwGear" onclick="openKw()" title="编辑关键词">⚙</div>
    <h1>财经雷达<span class="en">Market Radar</span></h1>
    <div class="meta">
      <span class="pulse"></span>
      <span>更新 <b id="updated">—</b></span>
      <span>共 <b id="count">0</b> 条</span>
      <span>港股 · 美股 · A股</span>
      <span>消费 · 科技</span>
    </div>
  </header>

  <div class="controls">
    <div class="tabs" id="tabs"></div>
  </div>

  <div class="feed" id="feed"></div>

  <div class="section-h" onclick="toggleWL()">
    <h2>关键词库 · Watchlist</h2><span class="ln"></span><span class="chev" id="wlchev">▾</span>
  </div>
  <div id="wlbox">
    <div class="wl" id="wl"></div>
    <div class="note" id="wlnote"></div>
  </div>
</div>

<div id="kwMask">
  <div id="kwPanel">
    <div class="kwhead">
      <h3>关键词编辑</h3>
      <div class="x" onclick="closeKw()">✕</div>
    </div>
    <div class="kwhint">每个标的有 <b style="color:var(--gold)">核心词</b>（金）和 <b>衍生词</b>。检索时全部展开。新增标的会自动用 AI 生成衍生词。改完点「保存到云端」即写回，下次推送生效。</div>
    <div class="kwadd">
      <input id="kwNewName" placeholder="新增标的名，如 商汤科技 / 比亚迪">
      <button class="kwbtn" id="kwAddBtn" onclick="kwAddEntry()">+ 添加并生成衍生词</button>
    </div>
    <div id="kwList"></div>
    <div class="kwbar">
      <span class="status" id="kwStatus"></span>
      <button class="kwbtn ghost" onclick="kwReload()">放弃改动</button>
      <button class="kwbtn gold" id="kwSaveBtn" onclick="kwSave()">保存到云端</button>
    </div>
  </div>
</div>

<div class="sample"><div id="banner">读取中…</div></div>
<div id="ptr"><span id="ptrText">下拉刷新</span></div>
<button id="refreshFab" aria-label="刷新" title="刷新">↻</button>

<script>

let activeTab = "全部";

/* ---- favorites with graceful fallback (works hosted via localStorage, degrades in preview) ---- */
const Fav = (()=>{
  let mem = {};
  let ok = true;
  try{ const t="__t"; localStorage.setItem(t,"1"); localStorage.removeItem(t); }catch(e){ ok=false; }
  const KEY="mr_favs";
  function load(){ if(!ok) return mem; try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return {}} }
  function save(o){ if(!ok){mem=o;return} try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){mem=o} }
  return {
    has:id=>!!load()[id],
    toggle:id=>{const o=load();o[id]?delete o[id]:o[id]=Date.now();save(o);return !!o[id];},
    count:()=>Object.keys(load()).length
  };
})();

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

const MKT_LABEL={HK:"港股",US:"美股",A:"A股"};
const TABS=["全部","收藏","港股","美股","A股","消费","科技"];
const CONSUMER=["泡泡玛特","老铺黄金","蜜雪冰城","美团","拼多多"];
const TECH=["腾讯","小米","英伟达","台积电","富途","SK海力士","美光","Circle","比特币","以太坊"];

function matchTab(it){
  if(activeTab==="全部")return true;
  if(activeTab==="收藏")return Fav.has(it.id);
  if(["港股","美股","A股"].includes(activeTab)){
    const code=Object.keys(MKT_LABEL).find(k=>MKT_LABEL[k]===activeTab);
    return (it.markets||[]).includes(code);
  }
  if(activeTab==="消费")return (it.keywords||[]).some(k=>CONSUMER.includes(k));
  if(activeTab==="科技")return (it.keywords||[]).some(k=>TECH.includes(k));
  return true;
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=TABS.map(t=>{
    let n="";
    if(t==="全部")n=DATA.items.length;
    else if(t==="收藏")n=Fav.count();
    else n=DATA.items.filter(it=>{const save=activeTab;activeTab=t;const m=matchTab(it);activeTab=save;return m;}).length;
    const on=activeTab===t?1:0;
    return `<div class="tab ${t==="收藏"?"star":""}" data-on="${on}" onclick="setTab('${t}')">${t}<span class="n">${n}</span></div>`;
  }).join("");
}
function setTab(t){activeTab=t;renderTabs();renderFeed();}

function card(it){
  const mkts=(it.markets||[]).map(m=>`<span class="mkt ${m}">${MKT_LABEL[m]||m}</span>`).join("");
  const tier=it.tier===1?'<span class="tier"><b>● 必读</b></span>':it.tier===2?'<span class="tier">● 重要</span>':'<span class="tier">○ 参考</span>';
  const kw=(it.keywords||[]).map(k=>`<span>${esc(k)}</span>`).join("");
  const trans=it.translated?'<span class="translated">译自外文</span>':"";
  const badge=it.verified?'<span class="badge">已核实</span>':'<span class="badge" style="color:var(--ink-faint);border-color:var(--ink-faint)">待核实</span>';
  const on=Fav.has(it.id)?1:0;
  const newPill=it.is_new?'<span class="new-pill">最新</span>':"";
  return `<article class="card" data-tier="${it.tier}" data-new="${it.is_new?1:0}" lang="${it.lang}">
    <div class="toprow">${mkts}${tier}${newPill}${trans}<span class="time">${esc(it.time||"")}</span></div>
    <div class="title">${esc(it.title)}</div>
    <div class="summary">${esc(it.summary||"")}</div>
    ${it.why?`<div class="why"><span>为何相关</span>${esc(it.why)}</div>`:""}
    <div class="botrow">
      <span class="src">${esc(it.source||"")}${badge}</span>
      <div class="kw">${kw}</div>
      <div class="actions">
        <div class="iconbtn star-btn" data-on="${on}" onclick="fav('${it.id}',this)" aria-label="收藏"></div>
        <a class="iconbtn" href="${esc(it.url||'#')}" target="_blank" rel="noopener" aria-label="打开原文">↗</a>
      </div>
    </div>
  </article>`;
}
function fav(id,el){const on=Fav.toggle(id);el.dataset.on=on?1:0;renderTabs();if(activeTab==="收藏")renderFeed();}

function renderFeed(){
  let list=DATA.items.filter(matchTab);
  const feed=document.getElementById("feed");
  if(!list.length){feed.innerHTML=`<div class="empty">${activeTab==="收藏"?"还没有收藏。点任意新闻右下角的 ☆ 收藏起来。":"暂无符合条件的新闻。"}</div>`;return;}
  list=list.map((it,i)=>[it,i]).sort((a,b)=>((b[0].is_new?1:0)-(a[0].is_new?1:0))||(a[1]-b[1])).map(p=>p[0]);
  const newCount=list.filter(it=>it.is_new).length;
  let html="";
  list.forEach((it,i)=>{
    if(newCount>0 && newCount<list.length && i===newCount){
      html+=`<div class="divider"><span class="ln"></span>历史推送<span class="ln"></span></div>`;
    }
    html+=card(it);
  });
  feed.innerHTML=html;
  document.querySelectorAll(".card").forEach((c,i)=>c.style.animationDelay=(i*40)+"ms");
}

function renderWL(){
  const pos=DATA.positions||[];
  const wl=(DATA.watchlist||[]).map(k=>`<span>${esc(k)}</span>`).join("")
    + pos.map(p=>`<span class="pos">${esc(p)}</span>`).join("");
  document.getElementById("wl").innerHTML=wl;
  document.getElementById("wlnote").textContent="金色为持仓（待接入 IBKR）。其余为初始关键词库，可随时增删；命中任一关键词的新闻会被纳入筛选。";
}
let wlOpen=true;
function toggleWL(){wlOpen=!wlOpen;document.getElementById("wlbox").style.display=wlOpen?"block":"none";document.getElementById("wlchev").style.transform=wlOpen?"none":"rotate(-90deg)";}

function paint(){
  document.getElementById("updated").textContent=DATA.updated_at||"—";
  document.getElementById("count").textContent=DATA.items.length;
  renderTabs();renderFeed();renderWL();
  const b=document.getElementById("banner");
  if(DATA.is_sample){b.innerHTML='当前为 <b>示例数据</b> · 接入云端后自动刷新';}
  else{const nc=(DATA.items||[]).filter(it=>it.is_new).length; b.innerHTML='实时数据 · 本次新增 <b>'+nc+'</b> 条 · 下次更新 <b>'+( (DATA.next_runs&&DATA.next_runs[0])||"" )+'</b>';}
}

/* 数据源：claude/radar-data 分支的 raw 文件 + 同目录 data.json（main 分支）两个都取，
   谁的 updated_at 更新就用谁——避免其中一条发布链路卡住时页面一直显示旧数据。 */
const RADAR_DATA_SOURCES = [
  "https://raw.githubusercontent.com/dzkeke-tech/market-radar/claude/radar-data/data.json",
  "data.json"
];
async function fetchOne(base){
  try{
    const r=await fetch(base+"?t="+Date.now(),{cache:"no-store"});
    if(r.ok){const j=await r.json(); if(j&&j.items) return j;}
  }catch(e){/* 该源失败，忽略 */}
  return null;
}
async function fetchRadarData(){
  const results=await Promise.all(RADAR_DATA_SOURCES.map(fetchOne));
  const valid=results.filter(Boolean);
  if(!valid.length) return null;
  // updated_at 形如 "2026-07-23 08:11 (北京时间)"，字符串比较即可得出更新的一份
  valid.sort((a,b)=>String(b.updated_at||"").localeCompare(String(a.updated_at||"")));
  return valid[0];
}

async function loadData(){
  if(loadData._busy) return; loadData._busy=true;
  const fab=document.getElementById("refreshFab");
  if(fab) fab.classList.add("spin");
  try{
    const j=await fetchRadarData();
    if(j){DATA=j; if(DATA.is_sample===undefined)DATA.is_sample=false;}
  }catch(e){/* 保留上一次数据 */}
  paint();
  loadData._last=Date.now();
  if(fab) fab.classList.remove("spin");
  loadData._busy=false;
}

/* 1) 手动刷新按钮 */
document.getElementById("refreshFab").addEventListener("click",loadData);

/* 2) 切回 App / 重新可见时自动刷新（解决“必须关掉重开”） */
function autoRefresh(){
  if(document.visibilityState!=="visible") return;
  if(loadData._last && Date.now()-loadData._last<2000) return; // 刚刷过就不重复
  loadData();
}
document.addEventListener("visibilitychange",autoRefresh);
window.addEventListener("pageshow",autoRefresh);
window.addEventListener("focus",autoRefresh);

/* 3) 下拉刷新 */
(function(){
  const ptr=document.getElementById("ptr"), txt=document.getElementById("ptrText");
  const TRIG=70; let startY=0, pulling=false, dist=0;
  const top=()=>(document.scrollingElement||document.documentElement).scrollTop;
  window.addEventListener("touchstart",e=>{
    if(top()<=0 && !loadData._busy){ startY=e.touches[0].clientY; pulling=true; dist=0; }
    else pulling=false;
  },{passive:true});
  window.addEventListener("touchmove",e=>{
    if(!pulling) return;
    dist=e.touches[0].clientY-startY;
    if(dist>0){
      ptr.style.height=Math.min(dist*0.5,80)+"px";
      ptr.classList.add("show");
      txt.textContent=dist>=TRIG?"松开刷新":"下拉刷新";
    }
  },{passive:true});
  window.addEventListener("touchend",()=>{
    if(!pulling) return; pulling=false;
    if(dist>=TRIG){ txt.textContent="刷新中…"; ptr.style.height="46px"; loadData().then(()=>{ ptr.classList.remove("show"); ptr.style.height=""; }); }
    else { ptr.classList.remove("show"); ptr.style.height=""; }
    dist=0;
  });
})();

/* ============================================================
   关键词编辑器：经 Cloudflare Worker 读/写 keywords.json + 生成衍生词
   ============================================================ */
const KW_WORKER = "https://radar-keywords.dzkeke.workers.dev";
let KW = null;          // 当前编辑中的 keywords 对象
let kwDirty = false;

function kwSetStatus(msg, kind){
  const el=document.getElementById("kwStatus"); if(!el) return;
  el.textContent=msg||"";
  el.style.color = kind==="err"?"var(--down)":kind==="ok"?"var(--up)":"var(--ink-faint)";
}
function openKw(){
  document.getElementById("kwMask").classList.add("show");
  if(!KW) kwReload(); else renderKw();
}
function closeKw(){
  if(kwDirty && !confirm("有未保存的改动，确定关闭？")) return;
  document.getElementById("kwMask").classList.remove("show");
}
document.getElementById("kwMask").addEventListener("click",e=>{ if(e.target.id==="kwMask") closeKw(); });

async function kwReload(){
  kwSetStatus("读取中…");
  try{
    const r=await fetch(KW_WORKER+"/keywords?t="+Date.now(),{cache:"no-store"});
    const j=await r.json();
    if(j.error) throw new Error(j.error);
    KW=j; if(!KW.entries) KW.entries={};
    kwDirty=false; renderKw(); kwSetStatus("已载入","ok");
  }catch(e){ kwSetStatus("读取失败："+e.message,"err"); }
}

function renderKw(){
  const box=document.getElementById("kwList"); if(!KW){box.innerHTML="";return;}
  const names=Object.keys(KW.entries||{});
  box.innerHTML = names.map(nm=>{
    const e=KW.entries[nm]||{core:[],derived:[]};
    const chips=(arr,type)=>arr.map((w,i)=>
      `<span class="chip ${type}">${esc(w)}<span class="rm" onclick="kwRm('${esc(nm)}','${type}',${i})">✕</span></span>`).join("")
      + `<input class="chipadd" placeholder="+词" onkeydown="kwAddChip(event,'${esc(nm)}','${type}',this)">`;
    return `<div class="kwentry">
      <div class="nm"><b>${esc(nm)}</b><span class="del" onclick="kwDelEntry('${esc(nm)}')">删除</span></div>
      <div class="kwrow"><div class="lab">核心词 core</div><div class="chips">${chips(e.core||[],'core')}</div></div>
      <div class="kwrow"><div class="lab">衍生词 derived</div><div class="chips">${chips(e.derived||[],'derived')}</div></div>
    </div>`;
  }).join("") || `<div class="kwhint">还没有标的，用上方输入框添加。</div>`;
}

function kwMark(){ kwDirty=true; kwSetStatus("有未保存改动"); }
function kwRm(nm,type,i){ KW.entries[nm][type].splice(i,1); kwMark(); renderKw(); }
function kwAddChip(ev,nm,type,inp){
  if(ev.key!=="Enter") return; ev.preventDefault();
  const v=inp.value.trim(); if(!v) return;
  const arr=KW.entries[nm][type]||(KW.entries[nm][type]=[]);
  if(!arr.some(x=>String(x).toLowerCase()===v.toLowerCase())) arr.push(v);
  kwMark(); renderKw();
}
function kwDelEntry(nm){
  if(!confirm("删除标的「"+nm+"」及其全部关键词？")) return;
  delete KW.entries[nm]; kwMark(); renderKw();
}
async function kwAddEntry(){
  const inp=document.getElementById("kwNewName"); const nm=(inp.value||"").trim();
  if(!nm) return;
  if(KW.entries[nm]){ kwSetStatus("该标的已存在","err"); return; }
  const btn=document.getElementById("kwAddBtn"); btn.disabled=true;
  KW.entries[nm]={core:[nm],derived:[]}; kwMark(); renderKw();
  kwSetStatus("正在用 AI 生成衍生词…");
  try{
    const r=await fetch(KW_WORKER+"/derive",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name:nm,core:[nm]})});
    const j=await r.json();
    if(j.error) throw new Error(j.error);
    KW.entries[nm].derived=j.derived||[];
    kwSetStatus("已生成 "+(j.derived||[]).length+" 个衍生词，可再编辑","ok");
  }catch(e){ kwSetStatus("衍生词生成失败（可手动添加）："+e.message,"err"); }
  inp.value=""; btn.disabled=false; renderKw();
}
async function kwSave(){
  if(!KW) return;
  const btn=document.getElementById("kwSaveBtn"); btn.disabled=true;
  kwSetStatus("保存中…");
  try{
    const r=await fetch(KW_WORKER+"/keywords",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(KW)});
    const j=await r.json();
    if(j.error) throw new Error(j.error);
    kwDirty=false; kwSetStatus("已保存到云端，下次推送生效 ✓","ok");
  }catch(e){ kwSetStatus("保存失败："+e.message,"err"); }
  btn.disabled=false;
}

loadData();
</script>
